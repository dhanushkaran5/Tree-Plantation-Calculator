<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Map Visualizer - EcoTree Impact Analyzer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="static/style.css">
    <style>
        .map-controls {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
            margin-bottom: 1rem;
        }
        .pin-info {
            background: var(--green-light);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L8 8H10V14H14V8H16L12 2Z" fill="white" opacity="0.9"/>
                        <path d="M12 14V22M10 14C10 14 7 12 7 9C7 6 9 6 10 6M14 14C14 14 17 12 17 9C17 6 15 6 14 6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                        <circle cx="7" cy="9" r="0.8" fill="white" opacity="0.7"/>
                        <circle cx="17" cy="9" r="0.8" fill="white" opacity="0.7"/>
                        <path d="M6 12L4 10M18 12L20 10" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="logo-text-main">EcoTree</span>
                    <span class="logo-text-sub">Impact Analyzer</span>
                </div>
            </a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="calculator.html">Calculator</a></li>
                <li><a href="advanced-calculator.html">Advanced</a></li>
                <li><a href="map.html">Map</a></li>
                <li><a href="bulk.html">Bulk Upload</a></li>
                <li><a href="pollution.html">Pollution</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h1 class="card-title">Tree Planting Map Visualizer</h1>
            <p>Click on the map to add tree planting locations and track your carbon impact</p>

            <div class="map-controls">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="mapSpecies">Default Species for New Pins</label>
                    <select id="mapSpecies">
                        <option value="Neem">Neem (20 kg/year)</option>
                        <option value="Mango">Mango (22 kg/year)</option>
                        <option value="Banyan">Banyan (48 kg/year)</option>
                        <option value="Eucalyptus">Eucalyptus (30 kg/year)</option>
                        <option value="Pine">Pine (12 kg/year)</option>
                        <option value="Acacia">Acacia (15 kg/year)</option>
                        <option value="Oak">Oak (25 kg/year)</option>
                        <option value="Teak">Teak (28 kg/year)</option>
                        <option value="Cedar">Cedar (35 kg/year)</option>
                        <option value="Gulmohar">Gulmohar (18 kg/year)</option>
                        <option value="Mahogany">Mahogany (32 kg/year)</option>
                        <option value="Peepal">Peepal (45 kg/year)</option>
                        <option value="Jamun">Jamun (24 kg/year)</option>
                        <option value="Arjun">Arjun (26 kg/year)</option>
                        <option value="Amaltas">Amaltas (20 kg/year)</option>
                        <option value="Kadam">Kadam (22 kg/year)</option>
                        <option value="Shisham">Shisham (28 kg/year)</option>
                        <option value="Semal">Semal (38 kg/year)</option>
                        <option value="Palash">Palash (19 kg/year)</option>
                        <option value="Ashoka">Ashoka (17 kg/year)</option>
                        <option value="Kachnar">Kachnar (21 kg/year)</option>
                        <option value="Baheda">Baheda (23 kg/year)</option>
                        <option value="Haritaki">Haritaki (25 kg/year)</option>
                        <option value="Bamboo">Bamboo (40 kg/year)</option>
                        <option value="Sandalwood">Sandalwood (29 kg/year)</option>
                        <option value="Casuarina">Casuarina (27 kg/year)</option>
                        <option value="Tamarind">Tamarind (26 kg/year)</option>
                        <option value="Coconut">Coconut (22 kg/year)</option>
                        <option value="Jackfruit">Jackfruit (24 kg/year)</option>
                        <option value="Pomegranate">Pomegranate (18 kg/year)</option>
                        <option value="Banyan Fig">Banyan Fig (44 kg/year)</option>
                        <option value="Sapota">Sapota (20 kg/year)</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="clearAllPins()">Clear All Pins</button>
                    <button class="btn btn-outline" onclick="exportMapData()">Export Map Data</button>
                </div>
            </div>

            <div id="map" class="map-container"></div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 2rem;">
                <div class="card">
                    <h3 class="card-title">Location Summary</h3>
                    <div id="locationSummary"></div>
                </div>
                <div class="card">
                    <h3 class="card-title">Species Distribution</h3>
                    <div id="speciesSummary"></div>
                </div>
            </div>

            <div class="card" style="margin-top: 2rem;">
                <h3 class="card-title">All Pins</h3>
                <div id="pinsList"></div>
            </div>
        </div>
    </div>

    <!-- Pin Details Modal -->
    <div id="pinModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closePinModal()">&times;</span>
            <h2>Edit Pin Details</h2>
            <form id="pinForm">
                <input type="hidden" id="pinId">
                <div class="form-group">
                    <label for="pinSpecies">Species</label>
                    <select id="pinSpecies" required>
                        <option value="Neem">Neem (20 kg/year)</option>
                        <option value="Mango">Mango (22 kg/year)</option>
                        <option value="Banyan">Banyan (48 kg/year)</option>
                        <option value="Eucalyptus">Eucalyptus (30 kg/year)</option>
                        <option value="Pine">Pine (12 kg/year)</option>
                        <option value="Acacia">Acacia (15 kg/year)</option>
                        <option value="Oak">Oak (25 kg/year)</option>
                        <option value="Teak">Teak (28 kg/year)</option>
                        <option value="Cedar">Cedar (35 kg/year)</option>
                        <option value="Gulmohar">Gulmohar (18 kg/year)</option>
                        <option value="Mahogany">Mahogany (32 kg/year)</option>
                        <option value="Peepal">Peepal (45 kg/year)</option>
                        <option value="Jamun">Jamun (24 kg/year)</option>
                        <option value="Arjun">Arjun (26 kg/year)</option>
                        <option value="Amaltas">Amaltas (20 kg/year)</option>
                        <option value="Kadam">Kadam (22 kg/year)</option>
                        <option value="Shisham">Shisham (28 kg/year)</option>
                        <option value="Semal">Semal (38 kg/year)</option>
                        <option value="Palash">Palash (19 kg/year)</option>
                        <option value="Ashoka">Ashoka (17 kg/year)</option>
                        <option value="Kachnar">Kachnar (21 kg/year)</option>
                        <option value="Baheda">Baheda (23 kg/year)</option>
                        <option value="Haritaki">Haritaki (25 kg/year)</option>
                        <option value="Bamboo">Bamboo (40 kg/year)</option>
                        <option value="Sandalwood">Sandalwood (29 kg/year)</option>
                        <option value="Casuarina">Casuarina (27 kg/year)</option>
                        <option value="Tamarind">Tamarind (26 kg/year)</option>
                        <option value="Coconut">Coconut (22 kg/year)</option>
                        <option value="Jackfruit">Jackfruit (24 kg/year)</option>
                        <option value="Pomegranate">Pomegranate (18 kg/year)</option>
                        <option value="Banyan Fig">Banyan Fig (44 kg/year)</option>
                        <option value="Sapota">Sapota (20 kg/year)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pinCount">Number of Trees</label>
                    <input type="number" id="pinCount" min="1" required>
                </div>
                <div class="form-group">
                    <label for="pinLocation">Location Name</label>
                    <input type="text" id="pinLocation" placeholder="Enter location name">
                </div>
                <div class="form-group">
                    <label for="pinYears">Years</label>
                    <input type="number" id="pinYears" min="1" value="1" required>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" onclick="deletePin()">Delete</button>
                    <button type="button" class="btn btn-outline" onclick="closePinModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="static/script.js"></script>
    <script src="static/cities-data.js"></script>
    <script src="static/auth.js"></script>
    <script src="static/auth-nav.js"></script>
    <script src="static/map.js"></script>
</body>
</html>
